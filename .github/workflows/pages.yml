name: Site

# Builds the project website (site/) and publishes it to GitHub Pages.
#
# Preview mode is the default: the build is noindex and shows every unfinished number with a
# "pending" badge. To launch, set the repository variables AMM_LAUNCH=1 (and AMM_SHOW_AUTHOR=1 to
# show the author block) under Settings > Secrets and variables > Actions > Variables, then re-run
# this workflow. A launch build refuses to publish while any rendered number is unfinished.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_BASE: /amm-optimizer
          SITE_URL: https://bjbodner.github.io
          AMM_LAUNCH: ${{ vars.AMM_LAUNCH }}
          AMM_SHOW_AUTHOR: ${{ vars.AMM_SHOW_AUTHOR }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
