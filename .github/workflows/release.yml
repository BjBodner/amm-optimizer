name: Release

# Build once, then publish with Trusted Publishing (OIDC): no API token exists anywhere.
# Needs, on PyPI and TestPyPI: a (pending) trusted publisher for this repository,
# workflow `release.yml` and environment `pypi` / `testpypi`; on GitHub: environments
# `pypi` and `testpypi` with a required reviewer. PyPI rejects new files on a release
# older than 14 days, so the sdist and every wheel are uploaded in this single run.
#
# A tag push then creates the GitHub Release, once PyPI has the files: its notes are the
# tag's CHANGELOG.md section (tools/changelog_section.py), and it carries the wheel, the
# sdist and a CycloneDX SBOM of the installed wheel. Only that last job may write to the
# repository, and it runs no code from it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions: {}

# One release run per ref at a time; a second run waits instead of cancelling a publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv build
      - run: |
          uvx twine check --strict dist/*
          # the same gate as ci.yml: the lean sdist is about 0.16 MB
          test "$(stat -c%s dist/*.tar.gz)" -lt 500000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write # Trusted Publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-files:
    name: Release notes and SBOM
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the checkout: CHANGELOG.md and tools/changelog_section.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: false # no cache in a release workflow
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: The tag, the wheel and the CHANGELOG name one version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          wheel=$(basename dist/*.whl)
          version=$(echo "${wheel}" | cut -d- -f2)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} but the wheel is ${wheel}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Release notes from the CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir release
          uv run --no-project python tools/changelog_section.py "${TAG}" \
            --link-base "https://github.com/${REPOSITORY}/blob/${TAG}/" > release/notes.md
          cat release/notes.md
      - name: CycloneDX SBOM of the wheel, installed in a clean environment
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/sbom-env"
          uv pip install --python "${RUNNER_TEMP}/sbom-env" dist/*.whl
          uvx --from "cyclonedx-bom==7.5.0" cyclonedx-py environment \
            --mc-type library --of JSON \
            -o "release/amm_optimizer-${VERSION}.cdx.json" "${RUNNER_TEMP}/sbom-env/bin/python"
          grep -q '"name": "amm-optimizer"' "release/amm_optimizer-${VERSION}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [publish-pypi, release-files]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files; no checkout, no repo code
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release/
      - name: Create the release with its files (one call, so it suits immutable releases)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          flags=()
          case "${TAG#v}" in
            *[!0-9.]*) flags+=(--prerelease) ;; # 0.6.0rc1, 0.6.0b2, ...
          esac
          gh release create "${TAG}" --repo "${REPOSITORY}" --verify-tag \
            --title "amm-optimizer ${TAG#v}" --notes-file release/notes.md "${flags[@]}" \
            dist/* release/*.cdx.json
