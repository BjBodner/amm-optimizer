repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '\.(json|gz|png|svg|info)$'
      - id: trailing-whitespace
        exclude: '\.(json|gz|png|svg|info|md)$'
  # Keep this rev equal to the ruff pin of the dev extra in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # The default tier is the contributor loop; `python tools/ci.py` runs the same
      # tests plus lint and types. The merge and full tiers are for releases.
      - id: pytest-default-tier
        name: pytest (not slow, not merge, not research)
        entry: python -m pytest -q -m "not slow and not merge and not research" -x
        language: system
        pass_filenames: false
        stages: [pre-push]
