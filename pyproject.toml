[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amm-optimizer"
# The version is read from src/amm_optimizer/__init__.py ([tool.hatch.version]); a
# release changes it there and in CITATION.cff (tests/test_version.py checks both).
dynamic = ["version"]
description = "Adaptive Multi Mode (AMM): budget-aware routing of derivative-free optimizers by online landscape probes (import amm_optimizer)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Jacob Bodner" }]
keywords = ["black-box optimization", "derivative-free", "COCO", "BBOB", "CMA-ES", "algorithm selection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
# SciPy: AMM's SLSQP, L-BFGS-B, COBYQA and Nelder-Mead stages and its surrogate model.
# SciPy 1.16 ported SLSQP to C, which changed some exit statuses; AMM's fallback from
# SLSQP to L-BFGS-B reads them and was calibrated with 1.18. SciPy 1.16.0 fails 11
# pinned tests (trajectories differ, two behavioural), so the floor is the version the
# results were recorded with. SciPy 1.18 needs Python >= 3.12 and NumPy >= 2.0. Widen
# only after a CI cell at the lower bound passes.
dependencies = ["numpy>=2.0", "scipy>=1.18"]

[project.urls]
Homepage = "https://github.com/BjBodner/amm-optimizer"
Documentation = "https://amm-optimizer.readthedocs.io"
Source = "https://github.com/BjBodner/amm-optimizer"
Issues = "https://github.com/BjBodner/amm-optimizer/issues"
Changelog = "https://github.com/BjBodner/amm-optimizer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# ruff is pinned to the rev of the ruff-pre-commit hook in .pre-commit-config.yaml, so
# that the hook, `python tools/ci.py` and CI format alike; bump both together.
dev = ["pytest>=8", "pytest-cov", "hypothesis", "ruff==0.17.1", "mypy", "coco-experiment"]
bench = ["coco-experiment", "cocopp"]
# The documentation site (mkdocs.yml, .readthedocs.yaml): `mkdocs build --strict`. The
# lower bounds are the versions the strict build was checked with. The cap: MkDocs 2 is
# announced without the plugin system that Material and mkdocstrings build on.
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.8",
  "mkdocstrings>=1.0.8",
  "mkdocstrings-python>=2.0.10",
  "mkdocs-include-markdown-plugin>=7.3",
]

# The sdist holds the library, its documentation and the metadata files. The tests,
# their snapshot data, reference/ and tools/ stay in the repository: the snapshot tests
# hold only in the environment that recorded them, and a git checkout runs all of them.
[tool.hatch.version]
path = "src/amm_optimizer/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/docs",
  "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/CITATION.cff", "/pyproject.toml",
]
# Hatchling always adds the .gitignore it reads its exclusions from; `exclude` cannot
# drop it (it is a force-include), so the sdist carries it.

[tool.hatch.build.targets.wheel]
packages = ["src/amm_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: the full tier (nightly / release): every named config and recorded arm",
  "merge: the merge tier, deselected in the default tier (-m \"not slow and not merge\")",
  "snapshot: bit-exact or trajectory-pinned; valid only in the environment of tests/characterisation.json (skipped elsewhere, see tests/conftest.py)",
]
filterwarnings = [
  "error::DeprecationWarning",
  # the research-only Variant options (config.RESEARCH_FIELDS) warn when set: a test
  # that sets one says so with its own filter, so a shipped configuration never warns
  'error:Variant\.:FutureWarning',
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# The golden/parity tests drive the legacy global stream on purpose.
"tests/golden/*" = ["NPY002"]
"tests/test_parity.py" = ["NPY002"]
"tests/test_minimize.py" = ["NPY002"]
"tests/test_determinism.py" = ["NPY002"]
"tests/test_rng_ledger.py" = ["NPY002"]
"benchmarks/*" = ["NPY002", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/amm_optimizer"]
